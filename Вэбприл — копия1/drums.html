<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">\
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="https://avatars.mds.yandex.net/i?id=a7bcf36956121d3c7b6bfe1bd47f3f2cd9d4a3ef-4076875-images-thumbs&n=13" type="image/x-icon">
    <meta name="theme-color" content="#2c3e2f">
        <link rel="icon" href="icons/i.webp">
    <title>Drum-Pad | Запись и воспроизведение</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Montserrat', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .drums-container {
            background: #2c3e2f;
            border-radius: 48px;
            padding: 30px 20px 20px 20px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            border-bottom: 6px solid #1e2a1e;
            width: 100%;
            max-width: 1000px;
        }

        /* Сетка барабанов */
        .drums-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            justify-items: center;
            align-items: center;
            margin: 20px 0 30px;
            padding: 20px;
            background: #0a0c0a;
            border-radius: 60px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.2);
        }

        /* Стиль барабанного пэда */
        .drum-pad {
            width: 100%;
            max-width: 160px;
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle at 30% 25%, #3a4a3a, #1a2a1a);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 12px 0 #0a120a, inset 0 2px 5px rgba(255,255,255,0.3);
            transition: all 0.05s linear;
            text-align: center;
            border: 1px solid #5a7a5a;
        }

        .drum-pad.active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #0a120a;
            background: radial-gradient(circle at 30% 25%, #5a7a5a, #2a3a2a);
        }

        .drum-pad kbd {
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            padding: 5px 12px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd966;
            margin-bottom: 8px;
            box-shadow: inset 0 1px 0 0 #5a5a5a, 0 2px 0 0 #111;
            font-family: monospace;
        }

        .drum-label {
            font-size: 1rem;
            font-weight: bold;
            color: #f2e8cf;
            text-shadow: 0 1px 2px black;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 40px;
            letter-spacing: 1px;
        }

        /* Панель управления (как на пианино) */
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 15px;
            color: #f2e8cf;
            text-shadow: 0 1px 2px black;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title {
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 2px;
        }

        .recorder-panel {
            display: flex;
            gap: 15px;
            background: #1e2a22;
            padding: 6px 15px;
            border-radius: 40px;
            align-items: center;
            font-family: monospace;
        }

        .record-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #666;
            transition: all 0.2s;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .record-indicator.recording {
            background-color: #ff3333;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.5; transform: scale(1.2);}
            100% { opacity: 1; transform: scale(1);}
        }

        .status-text {
            font-size: 0.9rem;
            font-weight: bold;
        }

        kbd {
            background: #2c2c2c;
            border-radius: 6px;
            padding: 2px 8px;
            font-weight: bold;
            color: #ffd966;
            margin: 0 2px;
            box-shadow: inset 0 1px 0 0 #5a5a5a, 0 1px 0 0 #111;
            font-size: 0.8rem;
        }

        .nav-button {
            background: #5a3e2b;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
            font-size: 1rem;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .nav-button:hover {
            background: #7a5a3e;
            transform: scale(1.02);
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.7;
            color: #c0cfb5;
        }

        @media (max-width: 650px) {
            .drums-grid { gap: 15px; }
            .drum-pad kbd { font-size: 1.2rem; padding: 3px 8px; }
            .drum-label { font-size: 0.7rem; }
            .title { font-size: 1rem; }
        }
        @media (max-width: 500px) {
            .drums-grid { gap: 10px; }
            .drum-label { display: none; }
            .drum-pad kbd { margin-bottom: 0; }
        }
    </style>
</head>
<body>
<div>
    <div class="drums-container">
        <div class="drums-grid" id="drums-grid">
            <!-- Пэды будут созданы скриптом -->
        </div>
        <div class="info-panel">
            <div class="title">🥁 Drum-Pad с записью</div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <div class="recorder-panel">
                    <div class="record-indicator" id="recordLed"></div>
                    <div class="status-text" id="recStatus">⚪ Запись выкл</div>
                    <kbd>Ё</kbd> — запись &nbsp;|&nbsp; <kbd>1</kbd> — воспр.
                </div>
                <a href="records.html" class="nav-button" style="margin-left:8px;">📼 Мои записи</a>
                <a href="index.html" class="nav-button">🎹 Перейти на пианино</a>
            </div>
        </div>
        <footer>
            🥁 Drum-Pad: кликайте мышкой или нажимайте клавиши <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>G</kbd> <kbd>H</kbd> <kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd><br>
            <strong>Запись:</strong> нажмите <kbd>Ё</kbd> (~) для старта/остановки, <kbd>1</kbd> для воспроизведения
        </footer>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 1. ДАННЫЕ БАРАБАНОВ: звуки, клавиши, названия
    // --------------------------------------------------------------
    const DRUMS_DATA = [
        { name: "Kick", key: "KeyA", displayKey: "A", sound: "kick", color: "#4a2a2a" },
        { name: "Snare", key: "KeyS", displayKey: "S", sound: "snare", color: "#4a4a2a" },
        { name: "Hi-Hat", key: "KeyD", displayKey: "D", sound: "hihat", color: "#2a4a2a" },
        { name: "Tom High", key: "KeyF", displayKey: "F", sound: "tomHigh", color: "#2a4a4a" },
        { name: "Tom Low", key: "KeyG", displayKey: "G", sound: "tomLow", color: "#4a2a4a" },
        { name: "Floor Tom", key: "KeyH", displayKey: "H", sound: "floorTom", color: "#6a4a2a" },
        { name: "Crash", key: "KeyJ", displayKey: "J", sound: "crash", color: "#6a6a2a" },
        { name: "Ride", key: "KeyK", displayKey: "K", sound: "ride", color: "#2a6a6a" },
        { name: "Clap", key: "KeyL", displayKey: "L", sound: "clap", color: "#6a2a6a" }
    ];

    // --------------------------------------------------------------
    // 2. АУДИО-ДВИЖОК (Web Audio API)
    // --------------------------------------------------------------
    let audioCtx = null;
    let activeSources = new Map(); // midi-like key -> source
    let soundBuffers = new Map();  // sound id -> AudioBuffer
    
    // Маппинг клавиш на звуки и DOM элементы
    const keyToDrumMap = new Map();
    const drumElements = new Map();
    
    async function initAudioContext() {
        if (audioCtx) return audioCtx;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }
    
    // Генерация звуков с помощью Web Audio (имитация барабанов)
    // чтобы не зависеть от внешних файлов, создаём синтезированные звуки
    function generateDrumSound(type, ctx, freq = 440, duration = 0.5) {
        const now = ctx.currentTime;
        const gainNode = ctx.createGain();
        gainNode.connect(ctx.destination);
        gainNode.gain.setValueAtTime(0.0001, now);
        
        let osc;
        switch(type) {
            case 'kick': // бас-бочка: низкий синус с быстрым затуханием
                osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 60;
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                osc.connect(gainNode);
                gainNode.gain.exponentialRampToValueAtTime(0.5, now + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
                osc.start();
                osc.stop(now + 0.8);
                break;
            case 'snare': // малый барабан: белый шум + короткий тон
                const noise = ctx.createBufferSource();
                const noiseGain = ctx.createGain();
                const bufferSize = ctx.sampleRate * 0.3;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buffer;
                noise.loop = false;
                noise.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noiseGain.gain.setValueAtTime(0.0001, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.4, now + 0.01);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                noise.start();
                noise.stop(now + 0.45);
                // короткий тон
                const tone = ctx.createOscillator();
                const toneGain = ctx.createGain();
                tone.type = 'triangle';
                tone.frequency.value = 180;
                tone.frequency.exponentialRampToValueAtTime(120, now + 0.15);
                tone.connect(toneGain);
                toneGain.connect(ctx.destination);
                toneGain.gain.setValueAtTime(0.0001, now);
                toneGain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
                toneGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
                tone.start();
                tone.stop(now + 0.4);
                return; // два источника отдельно
            case 'hihat':
                const hiNoise = ctx.createBufferSource();
                const hiGain = ctx.createGain();
                const hiBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
                const hiData = hiBuffer.getChannelData(0);
                for (let i = 0; i < hiBuffer.length; i++) hiData[i] = Math.random() * 2 - 1;
                hiNoise.buffer = hiBuffer;
                hiNoise.loop = false;
                hiNoise.connect(hiGain);
                hiGain.connect(ctx.destination);
                hiGain.gain.setValueAtTime(0.0001, now);
                hiGain.gain.exponentialRampToValueAtTime(0.25, now + 0.003);
                hiGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
                hiNoise.start();
                hiNoise.stop(now + 0.3);
                break;
            case 'tomHigh':
                const tomH = ctx.createOscillator();
                const tomHG = ctx.createGain();
                tomH.type = 'triangle';
                tomH.frequency.value = 300;
                tomH.frequency.exponentialRampToValueAtTime(200, now + 0.3);
                tomH.connect(tomHG);
                tomHG.connect(ctx.destination);
                tomHG.gain.setValueAtTime(0.0001, now);
                tomHG.gain.exponentialRampToValueAtTime(0.4, now + 0.02);
                tomHG.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
                tomH.start();
                tomH.stop(now + 0.65);
                break;
            case 'tomLow':
                const tomL = ctx.createOscillator();
                const tomLG = ctx.createGain();
                tomL.type = 'triangle';
                tomL.frequency.value = 150;
                tomL.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                tomL.connect(tomLG);
                tomLG.connect(ctx.destination);
                tomLG.gain.setValueAtTime(0.0001, now);
                tomLG.gain.exponentialRampToValueAtTime(0.4, now + 0.02);
                tomLG.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
                tomL.start();
                tomL.stop(now + 0.75);
                break;
            case 'floorTom':
                const floor = ctx.createOscillator();
                const floorG = ctx.createGain();
                floor.type = 'triangle';
                floor.frequency.value = 90;
                floor.frequency.exponentialRampToValueAtTime(70, now + 0.4);
                floor.connect(floorG);
                floorG.connect(ctx.destination);
                floorG.gain.setValueAtTime(0.0001, now);
                floorG.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
                floorG.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
                floor.start();
                floor.stop(now + 0.95);
                break;
            case 'crash':
                const crashNoise = ctx.createBufferSource();
                const crashG = ctx.createGain();
                const crashBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
                const crashData = crashBuf.getChannelData(0);
                for (let i = 0; i < crashBuf.length; i++) crashData[i] = Math.random() * 2 - 1;
                crashNoise.buffer = crashBuf;
                crashNoise.loop = false;
                crashNoise.connect(crashG);
                crashG.connect(ctx.destination);
                crashG.gain.setValueAtTime(0.0001, now);
                crashG.gain.exponentialRampToValueAtTime(0.35, now + 0.01);
                crashG.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
                crashNoise.start();
                crashNoise.stop(now + 2.1);
                break;
            case 'ride':
                const rideNoise = ctx.createBufferSource();
                const rideG = ctx.createGain();
                const rideBuf = ctx.createBuffer(1, ctx.sampleRate * 0.8, ctx.sampleRate);
                const rideData = rideBuf.getChannelData(0);
                for (let i = 0; i < rideBuf.length; i++) rideData[i] = Math.random() * 2 - 1;
                rideNoise.buffer = rideBuf;
                rideNoise.loop = false;
                rideNoise.connect(rideG);
                rideG.connect(ctx.destination);
                rideG.gain.setValueAtTime(0.0001, now);
                rideG.gain.exponentialRampToValueAtTime(0.25, now + 0.005);
                rideG.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
                rideNoise.start();
                rideNoise.stop(now + 0.75);
                break;
            case 'clap':
                const clapNoise = ctx.createBufferSource();
                const clapG = ctx.createGain();
                const clapBuf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
                const clapData = clapBuf.getChannelData(0);
                for (let i = 0; i < clapBuf.length; i++) clapData[i] = Math.random() * 2 - 1;
                clapNoise.buffer = clapBuf;
                clapNoise.loop = false;
                clapNoise.connect(clapG);
                clapG.connect(ctx.destination);
                clapG.gain.setValueAtTime(0.0001, now);
                clapG.gain.exponentialRampToValueAtTime(0.5, now + 0.005);
                clapG.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                clapNoise.start();
                clapNoise.stop(now + 0.25);
                break;
            default: return;
        }
    }
    
    async function playDrum(drumId, element) {
        if (!audioCtx) initAudioContext();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        
        const now = audioCtx.currentTime;
        generateDrumSound(drumId, audioCtx);
        
        if (element) {
            element.classList.add('active');
            setTimeout(() => {
                if (element) element.classList.remove('active');
            }, 150);
        }
        
        if (isRecording) {
            addRecordingEvent(drumId);
        }
    }
    
    // --------------------------------------------------------------
    // 3. ПОСТРОЕНИЕ ИНТЕРФЕЙСА
    // --------------------------------------------------------------
    const drumsGrid = document.getElementById('drums-grid');
    drumsGrid.innerHTML = '';
    
    DRUMS_DATA.forEach((drum, idx) => {
        const pad = document.createElement('div');
        pad.className = 'drum-pad';
        pad.setAttribute('data-sound', drum.sound);
        pad.style.background = `radial-gradient(circle at 30% 25%, ${drum.color}, #1a1a1a)`;
        
        const kbdSpan = document.createElement('kbd');
        kbdSpan.innerText = drum.displayKey;
        pad.appendChild(kbdSpan);
        
        const labelSpan = document.createElement('div');
        labelSpan.className = 'drum-label';
        labelSpan.innerText = drum.name;
        pad.appendChild(labelSpan);
        
        pad.addEventListener('mousedown', (e) => {
            e.preventDefault();
            playDrum(drum.sound, pad);
        });
        pad.addEventListener('touchstart', (e) => {
            e.preventDefault();
            playDrum(drum.sound, pad);
        });
        
        drumsGrid.appendChild(pad);
        keyToDrumMap.set(drum.key, { sound: drum.sound, element: pad });
        drumElements.set(drum.sound, pad);
    });
    
    // --------------------------------------------------------------
    // 4. ЗАПИСЬ И ВОСПРОИЗВЕДЕНИЕ
    // --------------------------------------------------------------
    let isRecording = false;
    let recordingStartTime = 0;
    let recordedEvents = []; // { timeOffset, sound }
    let playbackTimeoutIds = [];
    let isPlayingBack = false;
    
    const recordLed = document.getElementById('recordLed');
    const recStatusSpan = document.getElementById('recStatus');
    
    function updateRecorderUI() {
        if (isRecording) {
            recordLed.classList.add('recording');
            recStatusSpan.innerHTML = '🔴 ЗАПИСЬ ...';
        } else {
            recordLed.classList.remove('recording');
            recStatusSpan.innerHTML = '⚪ Запись выкл';
        }
    }
    
    function addRecordingEvent(sound) {
        if (!isRecording) return;
        const now = performance.now();
        const offset = now - recordingStartTime;
        recordedEvents.push({ timeOffset: offset, sound: sound });
    }
    
    function stopPlayback() {
        for (let id of playbackTimeoutIds) clearTimeout(id);
        playbackTimeoutIds = [];
        isPlayingBack = false;
    }
    
    async function startPlayback() {
        if (recordedEvents.length === 0) return;
        if (isPlayingBack) stopPlayback();
        if (!audioCtx) initAudioContext();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        isPlayingBack = true;
        const startTime = performance.now();
        for (let ev of recordedEvents) {
            const timeout = ev.timeOffset;
            const soundId = ev.sound;
            const element = drumElements.get(soundId);
            const id = setTimeout(() => {
                playDrum(soundId, element);
            }, timeout);
            playbackTimeoutIds.push(id);
        }
        const lastOffset = recordedEvents.length ? recordedEvents[recordedEvents.length-1].timeOffset : 0;
        const cleanupId = setTimeout(() => { isPlayingBack = false; playbackTimeoutIds = []; }, lastOffset + 500);
        playbackTimeoutIds.push(cleanupId);
    }
    
    function resetRecording() { recordedEvents = []; }
    
    function toggleRecording() {
        if (isRecording) {
            isRecording = false;
            updateRecorderUI();
        } else {
            resetRecording();
            isRecording = true;
            recordingStartTime = performance.now();
            updateRecorderUI();
        }
    }
    
    // --------------------------------------------------------------
    // 5. КЛАВИАТУРНОЕ УПРАВЛЕНИЕ
    // --------------------------------------------------------------
    function onGlobalKeyDown(event) {
        const code = event.code;
        if (code === 'Backquote') {
            event.preventDefault();
            toggleRecording();
        }
        else if (code === 'Digit1') {
            event.preventDefault();
            if (recordedEvents.length > 0) startPlayback();
        }
        else if (keyToDrumMap.has(code)) {
            event.preventDefault();
            const { sound, element } = keyToDrumMap.get(code);
            playDrum(sound, element);
        }
    }
    window.addEventListener('keydown', onGlobalKeyDown);
    
    // --------------------------------------------------------------
    // 6. РЕЗЮМЕ АУДИО КОНТЕКСТА ПРИ ПЕРВОМ ВЗАИМОДЕЙСТВИИ
    // --------------------------------------------------------------
    const resumeAudio = () => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    };
    document.body.addEventListener('click', resumeAudio);
    document.body.addEventListener('touchstart', resumeAudio);
    // --------------------------------------------------------------
// 7. СОХРАНЕНИЕ ЗАПИСЕЙ В LOCALSTORAGE
// --------------------------------------------------------------
const STORAGE_KEY = 'music_recordings';

function saveCurrentRecording() {
    if (recordedEvents.length === 0) return;
    
    const recordings = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    recordings.push({
        id: Date.now(),
        date: new Date().toISOString(),
        type: 'drums',
        instrument: 'drums',
        duration: recordedEvents.length ? recordedEvents[recordedEvents.length-1].timeOffset : 0,
        events: recordedEvents.map(ev => ({ timeOffset: ev.timeOffset, sound: ev.sound }))
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recordings));
    
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:20px;right:20px;background:#4a7a4a;color:white;padding:12px 24px;border-radius:30px;z-index:9999;font-family:monospace;box-shadow:0 5px 20px rgba(0,0,0,0.3);';
    toast.textContent = '✅ Запись сохранена!';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}

const originalToggleRecording = toggleRecording;
toggleRecording = function() {
    if (isRecording) {
        originalToggleRecording();
        saveCurrentRecording();
    } else {
        originalToggleRecording();
    }
};
</script>

    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered', reg))

  }
</script>
