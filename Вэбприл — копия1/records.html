<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="https://avatars.mds.yandex.net/i?id=a7bcf36956121d3c7b6bfe1bd47f3f2cd9d4a3ef-4076875-images-thumbs&n=13" type="image/x-icon">
    <meta name="theme-color" content="#2c3e2f">
        <link rel="icon" href="icons/i.webp">
    <title>Сохранённые записи | Пианино и Drum-Pad</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Segoe UI', 'Poppins', 'Montserrat', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .records-container {
            background: #2c3e2f;
            border-radius: 32px;
            padding: 30px 20px 20px 20px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            border-bottom: 6px solid #1e2a1e;
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .title {
            font-weight: bold;
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: #f2e8cf;
            text-shadow: 0 1px 2px black;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-button {
            background: #5a3e2b;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
            font-size: 1rem;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .nav-button:hover {
            background: #7a5a3e;
            transform: scale(1.02);
        }
        .nav-button.danger {
            background: #8b3a3a;
        }
        .nav-button.danger:hover {
            background: #b04a4a;
        }

        .recordings-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .recording-item {
            background: #1e2a22;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #3a4a3a;
            transition: all 0.2s;
        }
        .recording-item:hover {
            border-color: #6a8a6a;
            background: #263426;
        }

        .recording-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }

        .recording-date {
            font-size: 0.9rem;
            color: #a0b0a0;
            font-family: monospace;
        }

        .recording-type {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f2e8cf;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .recording-details {
            font-size: 0.85rem;
            color: #c0d0c0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .recording-details span {
            background: #2c3e2f;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .recording-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .play-btn, .delete-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .play-btn {
            background: #4a7a4a;
            color: white;
        }
        .play-btn:hover {
            background: #5a9a5a;
            transform: scale(1.05);
        }
        .play-btn.playing {
            background: #ca8a3a;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(202, 138, 58, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(202, 138, 58, 0); }
            100% { box-shadow: 0 0 0 0 rgba(202, 138, 58, 0); }
        }

        .delete-btn {
            background: #6a3a3a;
            color: white;
        }
        .delete-btn:hover {
            background: #9a4a4a;
        }

        .empty-message {
            text-align: center;
            color: #8a9a8a;
            font-size: 1.2rem;
            padding: 60px 20px;
            font-style: italic;
        }

        .now-playing {
            text-align: center;
            color: #ffd966;
            font-family: monospace;
            padding: 10px;
            background: #1e2a22;
            border-radius: 20px;
            margin-bottom: 15px;
            display: none;
        }
        .now-playing.visible {
            display: block;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.7;
            color: #c0cfb5;
        }

        @media (max-width: 600px) {
            .recording-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .recording-actions {
                align-self: flex-end;
            }
            .title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
<div>
    <div class="records-container">
        <div class="header">
            <div class="title">📼 Сохранённые записи</div>
            <div class="nav-buttons">
                <a href="index.html" class="nav-button">🎹 Пианино</a>
                <a href="drums.html" class="nav-button">🥁 Drum-Pad</a>
                <button class="nav-button danger" onclick="clearAllRecordings()">🗑 Удалить все</button>
            </div>
        </div>

        <div class="now-playing" id="nowPlaying">▶ Воспроизведение...</div>

        <div class="recordings-list" id="recordingsList">
            <div class="empty-message">Пока нет сохранённых записей.</div>
        </div>

        <footer>
            📁 Записи хранятся в памяти браузера. Не удаляйте данные сайта, чтобы сохранить их.
        </footer>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 1. ЗАГРУЗКА ЗАПИСЕЙ ИЗ LOCALSTORAGE
    // --------------------------------------------------------------
    const STORAGE_KEY = 'music_recordings';

    function loadAllRecordings() {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            try {
                return JSON.parse(data);
            } catch (e) {
                return [];
            }
        }
        return [];
    }

    function saveAllRecordings(recordings) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(recordings));
    }

    // --------------------------------------------------------------
    // 2. ОТОБРАЖЕНИЕ ЗАПИСЕЙ
    // --------------------------------------------------------------
    function renderRecordings() {
        const recordings = loadAllRecordings();
        const list = document.getElementById('recordingsList');
        if (recordings.length === 0) {
            list.innerHTML = '<div class="empty-message">Пока нет сохранённых записей. Запишите что-нибудь на пианино или барабанах!</div>';
            return;
        }

        list.innerHTML = recordings.map((rec, index) => {
            const date = new Date(rec.date);
            const dateStr = date.toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            const typeLabel = rec.type === 'piano' ? '🎹 Пианино' : '🥁 Барабаны';
            const instrumentName = rec.instrument || rec.type;
            const duration = rec.duration ? (rec.duration / 1000).toFixed(1) + ' сек' : '—';
            const eventsCount = rec.events ? rec.events.length : 0;

            return `
                <div class="recording-item" data-index="${index}">
                    <div class="recording-info">
                        <div class="recording-date">${dateStr}</div>
                        <div class="recording-type">${typeLabel}${rec.type === 'piano' ? ' (' + instrumentName + ')' : ''}</div>
                        <div class="recording-details">
                            <span>⏱ ${duration}</span>
                            <span>🎵 ${eventsCount} событий</span>
                        </div>
                    </div>
                    <div class="recording-actions">
                        <button class="play-btn" onclick="playRecording(${index}, this)" title="Воспроизвести">▶</button>
                        <button class="delete-btn" onclick="deleteRecording(${index})" title="Удалить">✕</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function deleteRecording(index) {
        if (confirm('Удалить эту запись?')) {
            const recordings = loadAllRecordings();
            recordings.splice(index, 1);
            saveAllRecordings(recordings);
            renderRecordings();
        }
    }

    function clearAllRecordings() {
        if (confirm('Удалить ВСЕ сохранённые записи? Это действие нельзя отменить.')) {
            localStorage.removeItem(STORAGE_KEY);
            renderRecordings();
        }
    }

    // --------------------------------------------------------------
    // 3. АУДИО-ДВИЖОК (объединённый из пианино и барабанов)
    // --------------------------------------------------------------
    let audioCtx = null;
    let activeOscillators = new Map(); // для пианино
    let isPlayingBack = false;
    let currentPlayingIndex = null;

    function initAudioContext() {
        if (audioCtx) return audioCtx;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }

    function getFrequencyFromMidi(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
    }

    // Пианино: воспроизведение ноты
    function playPianoNote(midi, instrument) {
        if (!audioCtx) initAudioContext();
        const freq = getFrequencyFromMidi(midi);
        const now = audioCtx.currentTime;
        let osc, gainNode, filterNode;

        switch (instrument || 'piano') {
            case 'piano':
                osc = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
                osc.start();
                activeOscillators.set(midi, { osc, gain: gainNode, synth: true });
                break;
            case 'violin':
                osc = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = freq;
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
                osc.start();
                activeOscillators.set(midi, { osc, gain: gainNode, synth: true });
                break;
            case 'guitar':
                osc = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
                osc.start();
                activeOscillators.set(midi, { osc, gain: gainNode, synth: true });
                break;
            case 'sound4':
                osc = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq;
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
                osc.start();
                activeOscillators.set(midi, { osc, gain: gainNode, synth: true });
                break;
            case 'sound5':
                osc = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.exponentialRampToValueAtTime(0.4, now + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
                osc.start();
                activeOscillators.set(midi, { osc, gain: gainNode, synth: true });
                break;
            case 'sound6':
                osc = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                filterNode = audioCtx.createBiquadFilter();
                osc.type = 'sawtooth';
                osc.frequency.value = freq;
                filterNode.type = 'lowpass';
                filterNode.frequency.value = 1200;
                osc.connect(filterNode);
                filterNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
                osc.start();
                activeOscillators.set(midi, { osc, gain: gainNode, filter: filterNode, synth: true });
                break;
            case 'sound7':
                osc = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
                osc.start();
                activeOscillators.set(midi, { osc, gain: gainNode, synth: true, longRelease: true });
                break;
            default:
                osc = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
                osc.start();
                activeOscillators.set(midi, { osc, gain: gainNode, synth: true });
        }
    }

    function releasePianoNote(midi) {
        const sound = activeOscillators.get(midi);
        if (!sound) return;
        const now = audioCtx.currentTime;
        try {
            sound.gain.gain.cancelScheduledValues(now);
            sound.gain.gain.setValueAtTime(sound.gain.gain.value, now);
            sound.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
            if (sound.osc) sound.osc.stop(now + 0.35);
            if (sound.filter) sound.filter.disconnect();
        } catch (e) {}
        activeOscillators.delete(midi);
    }

    // Барабаны: воспроизведение звука
    function generateDrumSound(type, ctx) {
        const now = ctx.currentTime;
        const gainNode = ctx.createGain();
        gainNode.connect(ctx.destination);
        gainNode.gain.setValueAtTime(0.0001, now);

        switch (type) {
            case 'kick':
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 60;
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                osc.connect(gainNode);
                gainNode.gain.exponentialRampToValueAtTime(0.5, now + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
                osc.start();
                osc.stop(now + 0.8);
                break;
            case 'snare':
                const noise = ctx.createBufferSource();
                const noiseGain = ctx.createGain();
                const bufferSize = ctx.sampleRate * 0.3;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buffer;
                noise.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noiseGain.gain.setValueAtTime(0.0001, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.4, now + 0.01);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                noise.start();
                noise.stop(now + 0.45);
                const tone = ctx.createOscillator();
                const toneGain = ctx.createGain();
                tone.type = 'triangle';
                tone.frequency.value = 180;
                tone.frequency.exponentialRampToValueAtTime(120, now + 0.15);
                tone.connect(toneGain);
                toneGain.connect(ctx.destination);
                toneGain.gain.setValueAtTime(0.0001, now);
                toneGain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
                toneGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
                tone.start();
                tone.stop(now + 0.4);
                break;
            case 'hihat':
                const hiNoise = ctx.createBufferSource();
                const hiGain = ctx.createGain();
                const hiBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
                const hiData = hiBuffer.getChannelData(0);
                for (let i = 0; i < hiBuffer.length; i++) hiData[i] = Math.random() * 2 - 1;
                hiNoise.buffer = hiBuffer;
                hiNoise.connect(hiGain);
                hiGain.connect(ctx.destination);
                hiGain.gain.setValueAtTime(0.0001, now);
                hiGain.gain.exponentialRampToValueAtTime(0.25, now + 0.003);
                hiGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
                hiNoise.start();
                hiNoise.stop(now + 0.3);
                break;
            case 'tomHigh':
                const tomH = ctx.createOscillator();
                const tomHG = ctx.createGain();
                tomH.type = 'triangle';
                tomH.frequency.value = 300;
                tomH.frequency.exponentialRampToValueAtTime(200, now + 0.3);
                tomH.connect(tomHG);
                tomHG.connect(ctx.destination);
                tomHG.gain.setValueAtTime(0.0001, now);
                tomHG.gain.exponentialRampToValueAtTime(0.4, now + 0.02);
                tomHG.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
                tomH.start();
                tomH.stop(now + 0.65);
                break;
            case 'tomLow':
                const tomL = ctx.createOscillator();
                const tomLG = ctx.createGain();
                tomL.type = 'triangle';
                tomL.frequency.value = 150;
                tomL.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                tomL.connect(tomLG);
                tomLG.connect(ctx.destination);
                tomLG.gain.setValueAtTime(0.0001, now);
                tomLG.gain.exponentialRampToValueAtTime(0.4, now + 0.02);
                tomLG.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
                tomL.start();
                tomL.stop(now + 0.75);
                break;
            case 'floorTom':
                const floor = ctx.createOscillator();
                const floorG = ctx.createGain();
                floor.type = 'triangle';
                floor.frequency.value = 90;
                floor.frequency.exponentialRampToValueAtTime(70, now + 0.4);
                floor.connect(floorG);
                floorG.connect(ctx.destination);
                floorG.gain.setValueAtTime(0.0001, now);
                floorG.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
                floorG.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
                floor.start();
                floor.stop(now + 0.95);
                break;
            case 'crash':
                const crashNoise = ctx.createBufferSource();
                const crashG = ctx.createGain();
                const crashBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
                const crashData = crashBuf.getChannelData(0);
                for (let i = 0; i < crashBuf.length; i++) crashData[i] = Math.random() * 2 - 1;
                crashNoise.buffer = crashBuf;
                crashNoise.connect(crashG);
                crashG.connect(ctx.destination);
                crashG.gain.setValueAtTime(0.0001, now);
                crashG.gain.exponentialRampToValueAtTime(0.35, now + 0.01);
                crashG.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
                crashNoise.start();
                crashNoise.stop(now + 2.1);
                break;
            case 'ride':
                const rideNoise = ctx.createBufferSource();
                const rideG = ctx.createGain();
                const rideBuf = ctx.createBuffer(1, ctx.sampleRate * 0.8, ctx.sampleRate);
                const rideData = rideBuf.getChannelData(0);
                for (let i = 0; i < rideBuf.length; i++) rideData[i] = Math.random() * 2 - 1;
                rideNoise.buffer = rideBuf;
                rideNoise.connect(rideG);
                rideG.connect(ctx.destination);
                rideG.gain.setValueAtTime(0.0001, now);
                rideG.gain.exponentialRampToValueAtTime(0.25, now + 0.005);
                rideG.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
                rideNoise.start();
                rideNoise.stop(now + 0.75);
                break;
            case 'clap':
                const clapNoise = ctx.createBufferSource();
                const clapG = ctx.createGain();
                const clapBuf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
                const clapData = clapBuf.getChannelData(0);
                for (let i = 0; i < clapBuf.length; i++) clapData[i] = Math.random() * 2 - 1;
                clapNoise.buffer = clapBuf;
                clapNoise.connect(clapG);
                clapG.connect(ctx.destination);
                clapG.gain.setValueAtTime(0.0001, now);
                clapG.gain.exponentialRampToValueAtTime(0.5, now + 0.005);
                clapG.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                clapNoise.start();
                clapNoise.stop(now + 0.25);
                break;
        }
    }

    // --------------------------------------------------------------
    // 4. ВОСПРОИЗВЕДЕНИЕ ЗАПИСИ
    // --------------------------------------------------------------
    let playbackTimeoutIds = [];

    async function playRecording(index, buttonElement) {
        if (isPlayingBack) {
            stopPlayback();
            if (currentPlayingIndex === index) {
                updatePlayButton(buttonElement, false);
                return;
            }
        }

        const recordings = loadAllRecordings();
        if (index >= recordings.length) return;

        const recording = recordings[index];
        if (!recording.events || recording.events.length === 0) return;

        if (!audioCtx) initAudioContext();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        isPlayingBack = true;
        currentPlayingIndex = index;

        // Подсветка текущей записи
        document.getElementById('nowPlaying').classList.add('visible');
        document.getElementById('nowPlaying').textContent = `▶ Воспроизведение: ${recording.type === 'piano' ? '🎹 Пианино' : '🥁 Барабаны'} (${new Date(recording.date).toLocaleTimeString()})`;

        updatePlayButton(buttonElement, true);

        for (let ev of recording.events) {
            const id = setTimeout(() => {
                if (recording.type === 'piano') {
                    if (ev.type === 'noteOn') {
                        playPianoNote(ev.midi, recording.instrument || 'piano');
                    } else if (ev.type === 'noteOff') {
                        releasePianoNote(ev.midi);
                    }
                } else if (recording.type === 'drums') {
                    generateDrumSound(ev.sound, audioCtx);
                }
            }, ev.timeOffset);
            playbackTimeoutIds.push(id);
        }

        const lastOffset = recording.events[recording.events.length - 1].timeOffset;
        const cleanupId = setTimeout(() => {
            stopPlayback();
            if (buttonElement) updatePlayButton(buttonElement, false);
            document.getElementById('nowPlaying').classList.remove('visible');
        }, lastOffset + 500);
        playbackTimeoutIds.push(cleanupId);
    }

    function stopPlayback() {
        for (let id of playbackTimeoutIds) clearTimeout(id);
        playbackTimeoutIds = [];
        isPlayingBack = false;
        // Остановить все активные ноты пианино
        for (let [midi, _] of activeOscillators) {
            releasePianoNote(midi);
        }
        // Обновить все кнопки play
        document.querySelectorAll('.play-btn').forEach(btn => btn.classList.remove('playing'));
        document.getElementById('nowPlaying').classList.remove('visible');
    }

    function updatePlayButton(button, isPlaying) {
        if (!button) return;
        if (isPlaying) {
            button.classList.add('playing');
            button.textContent = '⏸';
        } else {
            button.classList.remove('playing');
            button.textContent = '▶';
        }
    }

    // --------------------------------------------------------------
    // 5. ИНИЦИАЛИЗАЦИЯ
    // --------------------------------------------------------------
    renderRecordings();

    // Обработчик клика для резюме аудиоконтекста
    document.body.addEventListener('click', () => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    });
</script>

      .then(reg => console.log('SW registered', reg))
      .catch(err => console.log('SW error', err));
  }
</script>
